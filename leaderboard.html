<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-900 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Focus Rusher - Leaderboard</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <meta name="theme-color" content="#4f46e5">
  <style>
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #64748b; border-radius: 9999px; }
  </style>
</head>
<body class="h-full flex flex-col justify-between font-sans antialiased bg-slate-100 dark:bg-slate-950 text-slate-800 dark:text-slate-100 transition-colors duration-200 select-none">

  <!-- CONTENEDOR PRINCIPAL MÓVIL / PWA -->
  <div class="flex-1 flex flex-col max-w-md mx-auto w-full min-h-screen max-h-screen h-full relative shadow-2xl bg-white dark:bg-slate-900 border-x border-slate-200 dark:border-slate-800 overflow-hidden">

    <!-- CABECERA FIJA -->
    <header class="flex-shrink-0 bg-white/80 dark:bg-slate-900/90 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800 px-4 py-3 flex items-center justify-between z-30">
      <div class="flex items-center gap-3">
        <button onclick="goBack()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
          <i data-lucide="arrow-left" class="w-5 h-5"></i>
        </button>
        <div>
          <h1 class="text-base font-black text-slate-900 dark:text-white" data-i18n="title">Leaderboard</h1>
          <p id="school-badge-label" class="text-[10px] font-mono font-bold uppercase text-slate-400">CARGANDO...</p>
        </div>
      </div>

      <!-- Selector de Mes -->
      <div class="relative">
        <select id="month-selector" onchange="changeMonth()" class="text-xs font-bold py-1.5 px-3 rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-200 focus:outline-none cursor-pointer">
          <!-- Opciones generadas dinámicamente -->
        </select>
      </div>
    </header>

    <!-- CONTENIDO PRINCIPAL / LISTA DE RANKING -->
    <main class="flex-1 relative w-full overflow-y-auto p-4 space-y-3 bg-slate-50/50 dark:bg-slate-950/40">
      
      <!-- Pantalla de Carga -->
      <div id="loading-container" class="flex flex-col items-center justify-center h-64 space-y-3">
        <div class="w-8 h-8 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-xs font-semibold text-slate-400 animate-pulse" data-i18n="loading">Calculando posiciones...</p>
      </div>

      <!-- Contenedor del Ranking -->
      <div id="ranking-list" class="space-y-2.5 hidden">
        <!-- Se inyecta dinámicamente -->
      </div>

      <!-- Estado Vacío -->
      <div id="empty-state" class="hidden flex flex-col items-center justify-center h-64 text-center space-y-2">
        <i data-lucide="trophy" class="w-12 h-12 text-slate-300 dark:text-slate-700"></i>
        <p class="text-xs font-bold text-slate-500" data-i18n="noData">No hay registros para este mes</p>
      </div>

    </main>

  </div>

  <!-- SCRIPT DE LÓGICA Y FIREBASE -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD5nMXGPuYDLspZGAkS1nE3XSF6RvMaVdw",
      authDomain: "focusrusherv4.firebaseapp.com",
      projectId: "focusrusherv4",
      storageBucket: "focusrusherv4.firebasestorage.app",
      messagingSenderId: "821506625432",
      appId: "1:821506625432:web:f5428274eb45561c2be5ed"
    };

    const appId = typeof __app_id !== 'undefined' ? __app_id : 'focus-rusher-pwa';
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentSession = null;
    let usersCache = [];

    // Traducciones básicas
    const translations = {
      es: { title: "Leaderboard", loading: "Calculando posiciones...", noData: "No hay registros para este mes", pts: "PTS" },
      en: { title: "Leaderboard", loading: "Calculating standings...", noData: "No records for this month", pts: "PTS" }
    };
    let currentLang = localStorage.getItem('lang') || 'es';

    function applyLang() {
      const t = translations[currentLang] || translations.es;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (t[key]) el.innerText = t[key];
      });
    }

    // Inicializar Tema e Idioma
    function initThemeAndLang() {
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('dark');
      } else {
        document.documentElement.classList.remove('dark');
      }
      applyLang();
    }

    window.goBack = function() {
      window.location.href = 'home.html';
    };

    // Poblar Selector de Meses (últimos 6 meses)
    function initMonthSelector() {
      const select = document.getElementById('month-selector');
      const now = new Date();
      
      for (let i = 0; i < 6; i++) {
        const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
        const year = d.getFullYear();
        const month = d.getMonth(); // 0 - 11
        const monthNamesEs = ["Enero", "Febrero", "Marzo", "Abril", "Mayo", "Junio", "Julio", "Agosto", "Septiembre", "Octubre", "Noviembre", "Diciembre"];
        const monthNamesEn = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        
        const label = currentLang === 'en' ? `${monthNamesEn[month]} ${year}` : `${monthNamesEs[month]} ${year}`;
        const val = `${year}-${String(month + 1).padStart(2, '0')}`;
        
        const opt = document.createElement('option');
        opt.value = val;
        opt.innerText = label;
        select.appendChild(opt);
      }
    }

    window.changeMonth = function() {
      renderLeaderboard();
    };

    async function fetchClassData(schoolId) {
      try {
        const usersRef = collection(db, 'artifacts', appId, 'schools', schoolId, 'users');
        const usersSnap = await getDocs(usersRef);
        
        usersCache = [];
        for (const userDoc of usersSnap.docs) {
          const userData = userDoc.data();
          const uid = userDoc.id;
          
          // Obtener sesiones del usuario para calcular puntaje mensual
          const sessionsRef = collection(db, 'artifacts', appId, 'schools', schoolId, 'users', uid, 'sessions');
          const sessionsSnap = await getDocs(sessionsRef);
          
          const sessions = [];
          sessionsSnap.forEach(s => sessions.push(s.data()));

          usersCache.push({
            uid,
            email: userData.email || 'Estudiante',
            sessions
          });
        }
        renderLeaderboard();
      } catch (err) {
        console.error("Error al cargar datos del leaderboard:", err);
      }
    }

    function renderLeaderboard() {
      const selectedYM = document.getElementById('month-selector').value; // Ej: "2026-11"
      const rankingList = document.getElementById('ranking-list');
      const loading = document.getElementById('loading-container');
      const emptyState = document.getElementById('empty-state');

      loading.classList.add('hidden');
      rankingList.innerHTML = '';

      // Calcular puntos por usuario para el mes seleccionado
      const scoredUsers = usersCache.map(user => {
        let monthlyPoints = 0;
        user.sessions.forEach(session => {
          if (session.date && typeof session.date.toDate === 'function') {
            const dateObj = session.date.toDate();
            const ym = `${dateObj.getFullYear()}-${String(dateObj.getMonth() + 1).padStart(2, '0')}`;
            if (ym === selectedYM) {
              monthlyPoints += (session.points || 0);
            }
          }
        });
        return {
          email: user.email,
          uid: user.uid,
          points: monthlyPoints,
          isMe: currentSession && currentSession.uid === user.uid
        };
      });

      // Ordenar de mayor a menor puntaje
      scoredUsers.sort((a, b) => b.points - a.points);

      // Filtrar o mostrar
      if (scoredUsers.length === 0 || scoredUsers.every(u => u.points === 0)) {
        emptyState.classList.remove('hidden');
        rankingList.classList.add('hidden');
        return;
      }

      emptyState.classList.add('hidden');
      rankingList.classList.remove('hidden');

      scoredUsers.forEach((user, index) => {
        const rank = index + 1;
        const initial = user.email ? user.email.charAt(0).toUpperCase() : '?';
        const displayEmail = user.email.split('@')[0]; // Mostrar nombre de usuario antes del @

        // Insignias para el Top 3
        let rankBadge = `<span class="w-7 h-7 rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 font-mono text-xs font-bold flex items-center justify-center">${rank}</span>`;
        if (rank === 1) rankBadge = `<span class="w-7 h-7 rounded-full bg-amber-500 text-white font-mono text-xs font-black flex items-center justify-center shadow-md shadow-amber-500/30">🥇</span>`;
        if (rank === 2) rankBadge = `<span class="w-7 h-7 rounded-full bg-slate-300 text-slate-800 font-mono text-xs font-black flex items-center justify-center shadow-md">🥈</span>`;
        if (rank === 3) rankBadge = `<span class="w-7 h-7 rounded-full bg-amber-700 text-white font-mono text-xs font-black flex items-center justify-center shadow-md">🥉</span>`;

        const row = document.createElement('div');
        row.className = `flex items-center justify-between p-3.5 rounded-2xl border transition-all ${
          user.isMe 
            ? 'bg-indigo-50/80 dark:bg-indigo-950/40 border-indigo-200 dark:border-indigo-800/80 shadow-sm' 
            : 'bg-white dark:bg-slate-900 border-slate-200/80 dark:border-slate-800'
        }`;

        row.innerHTML = `
          <div class="flex items-center gap-3">
            ${rankBadge}
            <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-indigo-600 to-violet-500 text-white font-black text-sm uppercase flex items-center justify-center shadow-sm">
              ${initial}
            </div>
            <div>
              <p class="text-xs font-bold text-slate-900 dark:text-white truncate max-w-[140px] sm:max-w-[180px]">
                ${displayEmail} ${user.isMe ? '<span class="text-[10px] font-semibold text-indigo-600 dark:text-indigo-400">(Tú)</span>' : ''}
              </p>
              <p class="text-[10px] font-mono text-slate-400">Estudiante</p>
            </div>
          </div>
          <div class="text-right">
            <span class="text-xs font-black font-mono text-indigo-600 dark:text-indigo-400">${user.points.toLocaleString()}</span>
            <span class="text-[9px] font-bold text-slate-400 uppercase ml-0.5">PTS</span>
          </div>
        `;

        rankingList.appendChild(row);
      });
    }

    window.addEventListener('load', () => {
      initThemeAndLang();
      initMonthSelector();
      if (window.lucide) lucide.createIcons();

      try {
        const raw = sessionStorage.getItem('school_user_session') || localStorage.getItem('school_user_session');
        if (raw) currentSession = JSON.parse(raw);
      } catch (e) {}

      onAuthStateChanged(auth, (user) => {
        if (!user || !currentSession) {
          window.location.href = 'index.html';
          return;
        }
        document.getElementById('school-badge-label').innerText = currentSession.schoolId;
        fetchClassData(currentSession.schoolId);
      });
    });
  </script>
</body>
</html>
